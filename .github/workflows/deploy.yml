# Builds the two images, pushes them, then tells EC2 to pull and restart.
#
# Only runs when something the backend uses changes — a frontend edit
# should not restart the API. Coolify handles the frontend on its own.

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "Dockerfile.worker"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagged with the commit as well as latest, so a bad deploy can be
      # rolled back to a known image rather than "whatever latest was".
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            shibji0606/vouch-api:latest
            shibji0606/vouch-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            shibji0606/vouch-worker:latest
            shibji0606/vouch-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/vouch
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps

# Five containers. Three stores, and two of your own.
#
# Only the API publishes a port. Postgres, Qdrant and Valkey are reachable
# from the other containers by service name and from nowhere else — take a
# ports: line off and a service disappears from the host entirely.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vouch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vouch"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # No curl or wget in the image, so ask bash for the TCP port.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Service names, not localhost — inside a container localhost is
      # the container itself.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vouch
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://valkey:6379
    volumes:
      - uploads:/srv/temp_uploads
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      valkey: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vouch
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://valkey:6379
    volumes:
      # The same volume as the API. The API writes the PDF here and the
      # worker reads it; two separate folders would mean the worker
      # never finds the file.
      - uploads:/srv/temp_uploads
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      valkey: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  valkey_data:
  uploads:

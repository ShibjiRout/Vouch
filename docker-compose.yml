# Five containers. Three stores, and two of your own.
#
# Nothing is built here — the two images come from the registry, pushed
# with docker-compose.build.yml. On the server this file and .env are the
# only two files you need.
#
#   docker compose pull
#   docker compose up -d
#
# Only the API publishes a port, and only to 127.0.0.1, so nginx on the
# host can reach it and the internet cannot. The three stores publish
# nothing at all — they are reachable by service name from the other
# containers and from nowhere else.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vouch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vouch"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # No curl or wget in the image, so ask bash for the TCP port.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: shibji0606/vouch-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Service names, not localhost — inside a container localhost is
      # the container itself.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vouch
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://valkey:6379
    volumes:
      - uploads:/srv/temp_uploads
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      valkey: {condition: service_healthy}
    restart: unless-stopped

  worker:
    image: shibji0606/vouch-worker:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vouch
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://valkey:6379
    volumes:
      # The same volume as the API. The API writes the PDF here and the
      # worker reads it; two separate folders would mean the worker
      # never finds the file.
      - uploads:/srv/temp_uploads
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      valkey: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  valkey_data:
  uploads:

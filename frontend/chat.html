<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocLense - Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 12px 1.5rem;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left .title { font-size: 15px; font-weight: 600; }
        .header-left .case-id { font-size: 12px; color: #3b82f6; font-family: monospace; }
        .header-right { display: flex; gap: 8px; }
        .header-btn {
            padding: 6px 12px;
            font-size: 12px;
            background: transparent;
            border: 1px solid #222;
            border-radius: 6px;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }
        .header-btn:hover { border-color: #444; color: #e0e0e0; }
        .header-btn.danger:hover { border-color: #ef4444; color: #ef4444; }

        .processing-banner {
            display: none;
            padding: 8px 1.5rem;
            background: #1a1a0a;
            border-bottom: 1px solid #332;
            font-size: 13px;
            color: #f59e0b;
            align-items: center;
            gap: 8px;
        }
        .processing-banner.show { display: flex; }
        .processing-banner .dot {
            width: 6px; height: 6px;
            background: #f59e0b;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            max-width: 75%;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.6;
            border-radius: 14px;
        }
        .msg.user {
            align-self: flex-end;
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: #141414;
            border: 1px solid #1a1a1a;
            border-bottom-left-radius: 4px;
        }
        .msg .sources { margin-top: 6px; font-size: 11px; color: #555; }

        .typing {
            display: none;
            align-self: flex-start;
            padding: 10px 14px;
            background: #141414;
            border: 1px solid #1a1a1a;
            border-radius: 14px 14px 14px 4px;
        }
        .typing.show { display: flex; }
        .typing span {
            width: 6px; height: 6px;
            background: #444;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #444;
            gap: 8px;
        }
        .welcome-icon {
            width: 48px; height: 48px;
            background: #141414;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .welcome h2 { font-size: 16px; font-weight: 500; color: #888; }
        .welcome p { font-size: 13px; }

        .input-bar {
            padding: 12px 1.5rem;
            border-top: 1px solid #1a1a1a;
            display: flex;
            gap: 8px;
        }
        .input-bar input {
            flex: 1;
            padding: 10px 14px;
            background: #141414;
            border: 1px solid #222;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        .input-bar input::placeholder { color: #555; }
        .input-bar input:focus { border-color: #3b82f6; }
        .send-btn {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .send-btn:hover { background: #2563eb; }
        .send-btn:disabled { background: #1e3a5f; cursor: not-allowed; }

        /* Upload overlay */
        .upload-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .upload-overlay.show { display: flex; }
        .upload-box {
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 1.5rem;
            width: 100%;
            max-width: 420px;
        }
        .upload-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .upload-box-header h3 { font-size: 16px; font-weight: 500; }
        .upload-box-header .case-label {
            font-size: 12px;
            color: #3b82f6;
            font-family: monospace;
        }
        .upload-close {
            background: none;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
        }
        .upload-dropzone {
            border: 2px dashed #333;
            border-radius: 8px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        .upload-dropzone:hover, .upload-dropzone.dragover { border-color: #3b82f6; }
        .upload-dropzone-text { font-size: 14px; color: #888; }
        .upload-file-info {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #1a1a1a;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 13px;
        }
        .upload-file-info.show { display: flex; }
        .upload-error {
            display: none;
            font-size: 13px;
            color: #ef4444;
            margin-bottom: 1rem;
            padding: 8px 12px;
            background: #1a0a0a;
            border-radius: 6px;
            border: 1px solid #331111;
        }
        .upload-error.show { display: block; }
        .upload-submit {
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .upload-submit:hover { background: #2563eb; }
        .upload-submit:disabled { background: #1e3a5f; color: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="title">DocLense</div>
            <div class="case-id" id="headerCaseId"></div>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="copyId()">Copy ID</button>
            <button class="header-btn" onclick="showUploadOverlay()">Add PDF</button>
            <button class="header-btn danger" onclick="deleteCase()">Delete</button>
        </div>
    </div>

    <div class="processing-banner" id="processingBanner">
        <div class="dot"></div>
        <span id="processingText">Processing your document...</span>
    </div>

    <div class="messages" id="messages">
        <div class="welcome" id="welcome">
            <div class="welcome-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" stroke="#444" stroke-width="1.5"/>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="9" cy="9.5" r="1" fill="#444"/>
                    <circle cx="15" cy="9.5" r="1" fill="#444"/>
                </svg>
            </div>
            <h2>Ask anything about your documents</h2>
            <p>Answers come only from what's in your uploaded PDFs</p>
        </div>
        <div class="typing" id="typing">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="input-bar">
        <input type="text" id="questionInput" placeholder="Ask about your documents..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <div class="upload-overlay" id="uploadOverlay">
        <div class="upload-box">
            <div class="upload-box-header">
                <div>
                    <h3>Add another PDF</h3>
                    <div class="case-label" id="overlayCaseId"></div>
                </div>
                <button class="upload-close" onclick="hideUploadOverlay()">&times;</button>
            </div>
            <div class="upload-dropzone" id="uploadDropzone" onclick="uploadFileInput.click()">
                <div class="upload-dropzone-text">Drop PDF here or click to browse</div>
            </div>
            <input type="file" id="uploadFileInput" accept=".pdf" hidden>
            <div class="upload-file-info" id="uploadFileInfo">
                <span id="uploadFileName"></span>
                <button style="background:none;border:none;color:#666;cursor:pointer;font-size:16px;" onclick="removeUploadFile()">&times;</button>
            </div>
            <div class="upload-error" id="uploadError"></div>
            <button class="upload-submit" id="uploadSubmitBtn" onclick="submitUpload()" disabled>Upload</button>
        </div>
    </div>

    <script>
        const API = '';
        const params = new URLSearchParams(window.location.search);
        const caseId = params.get('case_id');
        const jobId = params.get('job_id');
        let uploadedFile = null;

        if (!caseId) window.location.href = 'upload.html';

        document.getElementById('headerCaseId').textContent = caseId;
        document.getElementById('overlayCaseId').textContent = caseId;

        // If we came with a job_id, poll processing status
        if (jobId) {
            document.getElementById('processingBanner').classList.add('show');
            pollStatus(jobId);
        }

        // Chat
        async function sendMessage() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            document.getElementById('welcome').style.display = 'none';
            addMessage(question, 'user');
            input.value = '';

            const typing = document.getElementById('typing');
            typing.classList.add('show');
            scrollToBottom();
            document.getElementById('sendBtn').disabled = true;

            try {
                const res = await fetch(`${API}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ case_id: caseId, question: question })
                });
                typing.classList.remove('show');

                if (res.ok) {
                    const data = await res.json();
                    addMessage(data.answer, 'assistant', data.sources);
                } else {
                    addMessage('Something went wrong. Please try again.', 'assistant');
                }
            } catch (e) {
                typing.classList.remove('show');
                addMessage('Failed to connect to server.', 'assistant');
            }

            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }

        function addMessage(text, role, sources) {
            const messages = document.getElementById('messages');
            const typing = document.getElementById('typing');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;

            if (sources) {
                const s = document.createElement('div');
                s.className = 'sources';
                s.textContent = `${sources} sources`;
                div.appendChild(s);
            }

            messages.insertBefore(div, typing);
            scrollToBottom();
        }

        function scrollToBottom() {
            const messages = document.getElementById('messages');
            messages.scrollTop = messages.scrollHeight;
        }

        // Status polling
        async function pollStatus(jId) {
            const banner = document.getElementById('processingBanner');
            const text = document.getElementById('processingText');
            const dot = document.querySelector('.processing-banner .dot');

            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${API}/status/${jId}`);
                    const data = await res.json();

                    if (data.status === 'finished') {
                        clearInterval(interval);
                        text.textContent = 'Document ready!';
                        text.style.color = '#22c55e';
                        dot.style.background = '#22c55e';
                        dot.style.animation = 'none';
                        setTimeout(() => banner.classList.remove('show'), 3000);
                    } else if (data.status === 'failed') {
                        clearInterval(interval);
                        text.textContent = 'Processing failed';
                        text.style.color = '#ef4444';
                        dot.style.background = '#ef4444';
                        dot.style.animation = 'none';
                    } else {
                        text.textContent = data.message;
                    }
                } catch (e) {
                    clearInterval(interval);
                }
            }, 2000);
        }

        // Upload overlay
        function showUploadOverlay() {
            document.getElementById('uploadOverlay').classList.add('show');
        }

        function hideUploadOverlay() {
            document.getElementById('uploadOverlay').classList.remove('show');
            resetUploadForm();
        }

        function resetUploadForm() {
            uploadedFile = null;
            document.getElementById('uploadFileInput').value = '';
            document.getElementById('uploadFileInfo').classList.remove('show');
            document.getElementById('uploadDropzone').style.display = 'block';
            document.getElementById('uploadError').classList.remove('show');
            document.getElementById('uploadSubmitBtn').disabled = true;
        }

        const uploadFileInput = document.getElementById('uploadFileInput');
        const uploadDropzone = document.getElementById('uploadDropzone');

        uploadDropzone.addEventListener('dragover', e => {
            e.preventDefault();
            uploadDropzone.classList.add('dragover');
        });
        uploadDropzone.addEventListener('dragleave', () => uploadDropzone.classList.remove('dragover'));
        uploadDropzone.addEventListener('drop', e => {
            e.preventDefault();
            uploadDropzone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.pdf')) {
                uploadedFile = file;
                showUploadFile(file.name);
            }
        });

        uploadFileInput.addEventListener('change', () => {
            if (uploadFileInput.files[0]) {
                uploadedFile = uploadFileInput.files[0];
                showUploadFile(uploadedFile.name);
            }
        });

        function showUploadFile(name) {
            document.getElementById('uploadFileName').textContent = name;
            document.getElementById('uploadFileInfo').classList.add('show');
            document.getElementById('uploadDropzone').style.display = 'none';
            document.getElementById('uploadSubmitBtn').disabled = false;
        }

        function removeUploadFile() {
            uploadedFile = null;
            uploadFileInput.value = '';
            document.getElementById('uploadFileInfo').classList.remove('show');
            document.getElementById('uploadDropzone').style.display = 'block';
            document.getElementById('uploadSubmitBtn').disabled = true;
        }

        async function submitUpload() {
            const formData = new FormData();
            formData.append('file', uploadedFile);
            formData.append('case_id', caseId);

            document.getElementById('uploadSubmitBtn').disabled = true;
            document.getElementById('uploadSubmitBtn').textContent = 'Uploading...';
            document.getElementById('uploadError').classList.remove('show');

            try {
                const res = await fetch(`${API}/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json();
                    const errorEl = document.getElementById('uploadError');
                    errorEl.textContent = err.detail;
                    errorEl.classList.add('show');
                    document.getElementById('uploadSubmitBtn').disabled = false;
                    document.getElementById('uploadSubmitBtn').textContent = 'Upload';
                    return;
                }

                const data = await res.json();

                // Show processing banner
                document.getElementById('processingBanner').classList.add('show');
                document.getElementById('processingText').textContent = 'Processing your document...';
                document.getElementById('processingText').style.color = '#f59e0b';
                const dot = document.querySelector('.processing-banner .dot');
                dot.style.background = '#f59e0b';
                dot.style.animation = 'pulse 1.5s infinite';
                pollStatus(data.job_id);

                // Close overlay
                hideUploadOverlay();

            } catch (e) {
                const errorEl = document.getElementById('uploadError');
                errorEl.textContent = 'Failed to connect to server';
                errorEl.classList.add('show');
                document.getElementById('uploadSubmitBtn').disabled = false;
                document.getElementById('uploadSubmitBtn').textContent = 'Upload';
            }
        }

        // Header actions
        function copyId() { navigator.clipboard.writeText(caseId); }

        async function deleteCase() {
            if (!confirm(`Delete all data for ${caseId}? This cannot be undone.`)) return;
            try {
                await fetch(`${API}/delete/${caseId}`, { method: 'DELETE' });
                window.location.href = 'upload.html';
            } catch (e) {
                alert('Failed to delete. Try again.');
            }
        }
    </script>
</body>
</html>

[project]
name = "04-doclense"
version = "0.1.0"
description = "RAG document assistant — upload PDFs into a chat, ask questions, get cited answers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2.0",
    "fastapi>=0.136.1",
    "fastembed>=0.5.0",
    "langchain>=1.2.15",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.1.9",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langmem>=0.0.27",
    "pdfplumber>=0.11.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.10.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "qdrant-client>=1.17.1",
    "redis>=7.4.0",
    "rq>=2.8.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
